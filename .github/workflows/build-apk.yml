name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone da app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#16251b'

      - name: Copiar o jogo para a app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-riding-club-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar o APK para download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rc-riding-club.apk

      - name: Publicar o APK nos Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: RC Riding Club (teste ${{ github.run_number }})
          body: APK de teste. No Android, abre o ficheiro e autoriza a instalação de fontes desconhecidas.
          make_latest: true
          files: rc-riding-club.apk
