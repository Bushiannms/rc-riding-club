name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone da app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#16251b'

      - name: Configurar AdMob e versão
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Copiar o jogo para a app
        run: npx cap sync android

      - name: Compilar (teste, sem chave)
        if: env.KS_B64 == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rc-riding-club.apk

      - name: Compilar e assinar (Play Store)
        if: env.KS_B64 != ''
        working-directory: android
        run: |
          chmod +x gradlew
          echo "$KS_B64" | base64 -d > ../upload.jks
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../upload.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../rc-riding-club.apk aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab ../rc-riding-club.aab
          jarsigner -keystore ../upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" ../rc-riding-club.aab rcupload
          rm ../upload.jks

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-riding-club-apk
          path: |
            rc-riding-club.apk
            rc-riding-club.aab
          if-no-files-found: ignore

      - name: Publicar nos Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: RC Riding Club (versão ${{ github.run_number }})
          body: APK para instalar no Android. O ficheiro .aab (quando existe) é o que se envia para a Google Play Console.
          make_latest: true
          files: |
            rc-riding-club.apk
            rc-riding-club.aab
          fail_on_unmatched_files: false
